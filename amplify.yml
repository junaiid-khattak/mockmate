version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(SUPABASE_SERVICE_ROLE_KEY|S3_BUCKET_RESUMES|SQS_QUEUE_URL|AWS_REGION|INTERVIEW_EXCHANGE_SECRET|INTERVIEW_APP_URL|BILLING_INTERNAL_SECRET|NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|NEXT_PUBLIC_APP_URL)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
