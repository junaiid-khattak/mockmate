version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(SUPABASE_SERVICE_ROLE_KEY|S3_BUCKET_RESUMES|SQS_QUEUE_URL|REGION|INTERVIEW_EXCHANGE_SECRET|INTERVIEW_APP_URL|BILLING_INTERNAL_SECRET|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|STRIPE_PRICE_ID_STARTER|STRIPE_PRICE_ID_STANDARD|STRIPE_PRICE_ID_PRO|STRIPE_PRICE_ID_POWER|STRIPE_PRICE_ID_INTRO|STRIPE_SUBSCRIPTION_PRICE_ID_ESSENTIALS_MONTHLY|STRIPE_SUBSCRIPTION_PRICE_ID_ELITE_MONTHLY|STRIPE_ESSENTIALS_CREDIT_PRICE_ID|STRIPE_ELITE_CREDIT_PRICE_ID|NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|NEXT_PUBLIC_APP_URL|NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
